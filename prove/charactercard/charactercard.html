<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Card</title>
    <link href="charactercard.css" rel="stylesheet">
</head>
<body>
    <div class="card">

        <img src="snortleblat.webp" alt="Character Image" class="image">

        <div class="name">
            Character Name
        </div>

        <div class="stats">
            <p><strong>Class:</strong> Swamp Beast Diplomat</p>
            <p><strong>Level:</strong> 5</p>
            <p><strong>Health:</strong> 100</p>
        </div>

        <div class="buttons">
            <button>Attack</button>
            <button>Defend</button>
        </div>

    </div>
</body>
</html>
